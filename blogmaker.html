<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NukeTheFoids CMS</title>
<style>
  :root {
    --bg: #fff; --bg2: #f6f6f6; --bg3: #eee;
    --fg: #000; --fg2: #555; --fg3: #888;
    --border: #e0e0e0; --border2: #ccc;
    --accent: #000; --accent-fg: #fff;
    --green: #16a34a; --red: #dc2626; --yellow: #ca8a04;
    --radius: 6px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "SFMono-Regular", Consolas, monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--font); background:var(--bg2); color:var(--fg); min-height:100vh; }

  /* ===== Layout ===== */
  .app { display:flex; height:100vh; overflow:hidden; }
  .sidebar { width:280px; min-width:280px; background:var(--bg); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
  .main { flex:1; display:flex; flex-direction:column; overflow:hidden; background:var(--bg); }

  /* ===== Sidebar Header ===== */
  .sidebar-header { padding:1rem; border-bottom:1px solid var(--border); }
  .sidebar-brand { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem; }
  .sidebar-brand h1 { font-size:1rem; font-weight:700; }
  .sidebar-actions { display:flex; gap:0.35rem; }
  .sidebar-actions button, .icon-btn { width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg); color:var(--fg2); cursor:pointer; font-size:0.85rem; transition:all 0.15s; }
  .sidebar-actions button:hover, .icon-btn:hover { border-color:var(--accent); color:var(--fg); }

  /* ===== Search ===== */
  .sidebar-search { position:relative; }
  .sidebar-search input { width:100%; padding:0.5rem 0.75rem 0.5rem 2rem; font-size:0.85rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg2); outline:none; }
  .sidebar-search input:focus { border-color:var(--accent); }
  .sidebar-search-icon { position:absolute; left:0.6rem; top:50%; transform:translateY(-50%); color:var(--fg3); font-size:0.8rem; pointer-events:none; }

  /* ===== Filter Tabs ===== */
  .filter-tabs { display:flex; gap:0; padding:0.5rem 1rem; border-bottom:1px solid var(--border); }
  .filter-tab { padding:0.3rem 0.6rem; font-size:0.75rem; font-weight:500; border:none; background:none; color:var(--fg3); cursor:pointer; border-radius:var(--radius); transition:all 0.15s; }
  .filter-tab:hover { color:var(--fg); background:var(--bg2); }
  .filter-tab.active { color:var(--accent-fg); background:var(--accent); }
  .filter-count { font-size:0.65rem; background:var(--bg3); padding:0.1rem 0.35rem; border-radius:10px; margin-left:0.25rem; }
  .filter-tab.active .filter-count { background:rgba(255,255,255,0.2); }

  /* ===== Article List ===== */
  .article-list { flex:1; overflow-y:auto; padding:0.5rem; }
  .article-item { padding:0.65rem 0.75rem; border-radius:var(--radius); cursor:pointer; margin-bottom:0.25rem; transition:all 0.1s; border:1px solid transparent; }
  .article-item:hover { background:var(--bg2); }
  .article-item.active { background:var(--bg2); border-color:var(--border); }
  .article-item-title { font-size:0.85rem; font-weight:600; margin-bottom:0.2rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .article-item-meta { display:flex; align-items:center; gap:0.4rem; font-size:0.7rem; color:var(--fg3); }
  .article-item-pin { color:var(--yellow); }
  .status-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .status-dot.published { background:var(--green); }
  .status-dot.draft { background:var(--yellow); }

  /* ===== Main Header ===== */
  .main-header { display:flex; justify-content:space-between; align-items:center; padding:0.75rem 1.25rem; border-bottom:1px solid var(--border); background:var(--bg); }
  .main-tabs { display:flex; gap:0; }
  .main-tab { padding:0.45rem 1rem; font-size:0.85rem; font-weight:500; border:none; background:none; color:var(--fg2); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.15s; }
  .main-tab:hover { color:var(--fg); }
  .main-tab.active { color:var(--fg); font-weight:700; border-bottom-color:var(--accent); }
  .header-actions { display:flex; gap:0.5rem; align-items:center; }

  /* ===== Editor ===== */
  .editor-scroll { flex:1; overflow-y:auto; padding:1.25rem; }
  .field { margin-bottom:0.85rem; }
  .field label { display:block; font-size:0.75rem; font-weight:600; margin-bottom:0.3rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--fg3); }
  .field input, .field textarea, .field select { width:100%; padding:0.55rem 0.75rem; font-size:0.9rem; font-family:var(--font); background:var(--bg2); color:var(--fg); border:1px solid var(--border); border-radius:var(--radius); outline:none; transition:border 0.15s; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color:var(--accent); }
  .field textarea { resize:vertical; min-height:1.5rem; }
  .field-row { display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; }
  .field-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:0.75rem; }

  /* ===== Cover Upload ===== */
  .cover-upload { display:flex; gap:0.75rem; align-items:center; }
  .cover-preview { width:80px; height:50px; border-radius:var(--radius); border:1px solid var(--border); overflow:hidden; background:var(--bg2); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .cover-preview img { width:100%; height:100%; object-fit:cover; }
  .cover-preview-placeholder { color:var(--fg3); font-size:0.7rem; }
  .cover-actions { display:flex; gap:0.35rem; }

  /* ===== Toolbar ===== */
  .toolbar { display:flex; flex-wrap:wrap; gap:2px; padding:0.4rem 0.5rem; background:var(--bg2); border:1px solid var(--border); border-bottom:none; border-radius:var(--radius) var(--radius) 0 0; }
  .toolbar button { padding:0.3rem 0.55rem; font-size:0.8rem; font-family:var(--font); background:none; color:var(--fg2); border:1px solid transparent; border-radius:3px; cursor:pointer; transition:all 0.1s; }
  .toolbar button:hover { background:var(--border); color:var(--fg); }
  .toolbar .sep { width:1px; background:var(--border); margin:0 0.25rem; align-self:stretch; }

  /* ===== Editor Textarea ===== */
  #editor { width:100%; min-height:400px; padding:0.85rem 1rem; font-size:0.9rem; font-family:var(--mono); line-height:1.7; background:var(--bg); color:var(--fg); border:1px solid var(--border); border-radius:0 0 var(--radius) var(--radius); outline:none; resize:vertical; tab-size:2; }
  #editor:focus { border-color:var(--accent); }

  /* ===== Preview ===== */
  #preview { display:none; width:100%; min-height:400px; padding:1.25rem; background:var(--bg); border:1px solid var(--border); border-radius:0 0 var(--radius) var(--radius); overflow-y:auto; font-size:0.9rem; line-height:1.8; }
  #preview h1 { font-size:1.6rem; margin:1.25rem 0 0.6rem; font-weight:700; }
  #preview h2 { font-size:1.3rem; margin:1.25rem 0 0.6rem; font-weight:700; }
  #preview h3 { font-size:1.1rem; margin:1rem 0 0.5rem; font-weight:700; }
  #preview p { margin-bottom:0.85rem; color:var(--fg2); }
  #preview strong { font-weight:700; }
  #preview em { font-style:italic; }
  #preview a { color:var(--fg); text-decoration:underline; }
  #preview code { font-family:var(--mono); background:var(--bg2); padding:0.1em 0.35em; border-radius:3px; font-size:0.88em; }
  #preview pre { background:var(--bg2); border-radius:var(--radius); padding:0.85rem; overflow-x:auto; margin-bottom:0.85rem; }
  #preview pre code { background:none; padding:0; }
  #preview blockquote { border-left:3px solid var(--border2); padding:0.4rem 0.85rem; margin:0.85rem 0; color:var(--fg2); }
  #preview img { max-width:100%; border-radius:var(--radius); margin:0.85rem 0; }
  #preview ul, #preview ol { padding-left:1.5rem; margin-bottom:0.85rem; }
  #preview li { margin-bottom:0.25rem; }
  #preview hr { border:none; border-top:1px solid var(--border); margin:1.5rem 0; }

  /* ===== Buttons ===== */
  .btn { padding:0.5rem 1rem; font-size:0.85rem; font-weight:600; font-family:var(--font); border-radius:var(--radius); cursor:pointer; transition:all 0.15s; border:1px solid var(--border); background:var(--bg2); color:var(--fg); }
  .btn:hover { border-color:var(--accent); }
  .btn-primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .btn-primary:hover { opacity:0.85; }
  .btn-green { background:var(--green); color:#fff; border-color:var(--green); }
  .btn-green:hover { opacity:0.85; }
  .btn-red { background:var(--red); color:#fff; border-color:var(--red); }
  .btn-red:hover { opacity:0.85; }
  .btn-sm { padding:0.35rem 0.65rem; font-size:0.78rem; }
  .btn:disabled { opacity:0.4; cursor:not-allowed; }

  /* ===== Modal ===== */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:1000; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--bg); border-radius:var(--radius); width:90%; max-width:440px; box-shadow:0 8px 30px rgba(0,0,0,0.15); }
  .modal-header { display:flex; justify-content:space-between; align-items:center; padding:1rem 1.25rem; border-bottom:1px solid var(--border); }
  .modal-header h2 { font-size:1rem; font-weight:700; }
  .modal-body { padding:1.25rem; }
  .modal-footer { display:flex; justify-content:flex-end; gap:0.5rem; padding:0.75rem 1.25rem; border-top:1px solid var(--border); }

  /* ===== Toast ===== */
  .toast { position:fixed; bottom:1.5rem; right:1.5rem; padding:0.65rem 1rem; background:var(--fg); color:var(--accent-fg); border-radius:var(--radius); font-size:0.85rem; font-weight:500; z-index:2000; transform:translateY(10px); opacity:0; transition:all 0.2s; pointer-events:none; }
  .toast.show { transform:translateY(0); opacity:1; }
  .toast.error { background:var(--red); }
  .toast.success { background:var(--green); }

  /* ===== Empty State ===== */
  .empty-state { text-align:center; padding:3rem 1rem; color:var(--fg3); }
  .empty-state p { font-size:0.9rem; margin-bottom:0.5rem; }

  /* ===== Loading ===== */
  .loading { display:flex; align-items:center; justify-content:center; padding:2rem; color:var(--fg3); font-size:0.85rem; gap:0.5rem; }
  .spinner { width:16px; height:16px; border:2px solid var(--border); border-top-color:var(--fg); border-radius:50%; animation:spin 0.6s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ===== Responsive ===== */
  @media (max-width: 768px) {
    .app { flex-direction:column; }
    .sidebar { width:100%; min-width:100%; max-height:40vh; border-right:none; border-bottom:1px solid var(--border); }
    .field-row, .field-row-3 { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <h1>Articles</h1>
        <div class="sidebar-actions">
          <button onclick="openSettings()" title="Settings">&#9881;</button>
          <button onclick="createNew()" title="New Article">+</button>
        </div>
      </div>
      <div class="sidebar-search">
        <span class="sidebar-search-icon">&#128269;</span>
        <input type="text" id="search-input" placeholder="Search articles..." oninput="filterArticles()">
      </div>
    </div>
    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all" onclick="setFilter('all',this)">All<span class="filter-count" id="count-all">0</span></button>
      <button class="filter-tab" data-filter="published" onclick="setFilter('published',this)">Published<span class="filter-count" id="count-published">0</span></button>
      <button class="filter-tab" data-filter="draft" onclick="setFilter('draft',this)">Drafts<span class="filter-count" id="count-draft">0</span></button>
      <button class="filter-tab" data-filter="pinned" onclick="setFilter('pinned',this)">Pinned<span class="filter-count" id="count-pinned">0</span></button>
    </div>
    <div class="article-list" id="article-list">
      <div class="loading"><div class="spinner"></div> Loading...</div>
    </div>
  </aside>

  <!-- Main Editor -->
  <div class="main">
    <div class="main-header">
      <div class="main-tabs">
        <button class="main-tab active" data-tab="write" onclick="switchTab('write',this)">Write</button>
        <button class="main-tab" data-tab="preview" onclick="switchTab('preview',this)">Preview</button>
      </div>
      <div class="header-actions">
        <button class="btn btn-sm" id="btn-draft" onclick="saveAsDraft()">Save Draft</button>
        <button class="btn btn-sm btn-green" id="btn-publish" onclick="publishArticle()">Publish</button>
      </div>
    </div>

    <div class="editor-scroll">
      <div id="write-panel">
        <div class="field-row">
          <div class="field">
            <label>Title</label>
            <input type="text" id="f-title" placeholder="Article title..." oninput="updateSlug()">
          </div>
          <div class="field">
            <label>Date</label>
            <input type="date" id="f-date">
          </div>
        </div>
        <div class="field">
          <label>Excerpt</label>
          <input type="text" id="f-excerpt" placeholder="Brief summary, 1-2 sentences">
        </div>
        <div class="field-row-3">
          <div class="field">
            <label>Tags (comma separated)</label>
            <input type="text" id="f-tags" placeholder="Technology, Opinion">
          </div>
          <div class="field">
            <label>Cover Image</label>
            <div class="cover-upload">
              <div class="cover-preview" id="cover-preview">
                <span class="cover-preview-placeholder">No image</span>
              </div>
              <div class="cover-actions">
                <button class="btn btn-sm" onclick="document.getElementById('cover-input').click()">Upload</button>
                <button class="btn btn-sm" onclick="clearCover()">Remove</button>
              </div>
              <input type="file" id="cover-input" accept="image/*" style="display:none" onchange="handleCoverUpload(event)">
            </div>
          </div>
          <div class="field">
            <label>Status</label>
            <select id="f-status">
              <option value="published">Published</option>
              <option value="draft">Draft</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;text-transform:none;letter-spacing:0;">
            <input type="checkbox" id="f-pinned" style="width:auto;margin:0;"> Pin this article
          </label>
        </div>
        <div class="slug-preview" id="slug-preview" style="font-family:var(--mono);font-size:0.75rem;color:var(--fg3);margin-bottom:0.75rem;">Slug: --</div>
      </div>

      <div>
        <div class="toolbar" id="toolbar">
          <button title="Bold" onclick="insertFormat('bold')"><b>B</b></button>
          <button title="Italic" onclick="insertFormat('italic')"><i>I</i></button>
          <button title="Strikethrough" onclick="insertFormat('strike')"><s>S</s></button>
          <div class="sep"></div>
          <button title="Heading 2" onclick="insertFormat('h2')">H2</button>
          <button title="Heading 3" onclick="insertFormat('h3')">H3</button>
          <div class="sep"></div>
          <button title="Link" onclick="insertFormat('link')">&#128279;</button>
          <button title="Upload & Insert Image" onclick="triggerInlineImage()">&#128444;</button>
          <button title="Code block" onclick="insertFormat('code')">&#10216;/&#10217;</button>
          <button title="Inline code" onclick="insertFormat('inlinecode')"><code>`c`</code></button>
          <div class="sep"></div>
          <button title="Blockquote" onclick="insertFormat('quote')">&#10077;</button>
          <button title="Bullet list" onclick="insertFormat('ul')">&#8226; List</button>
          <button title="Ordered list" onclick="insertFormat('ol')">1. List</button>
          <button title="Horizontal rule" onclick="insertFormat('hr')">&#8212;</button>
        </div>
        <textarea id="editor" placeholder="Write your article content here...&#10;&#10;Use the toolbar above for MDX formatting. Click the image button to upload and insert images."></textarea>
        <div id="preview"></div>
        <input type="file" id="inline-image-input" accept="image/*" style="display:none" onchange="handleInlineImage(event)">
      </div>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <div class="modal-header">
      <h2>GitHub Settings</h2>
      <button class="icon-btn" onclick="closeSettings()">&#10005;</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>GitHub Token (PAT)</label>
        <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Repo Owner</label>
          <input type="text" id="gh-owner" placeholder="zarrcodes">
        </div>
        <div class="field">
          <label>Repo Name</label>
          <input type="text" id="gh-repo" placeholder="nukethefoids.fun">
        </div>
      </div>
      <div style="font-size:0.75rem;color:var(--fg3);margin-top:0.5rem;">
        Token needs <code>repo</code> scope. Saved in localStorage only.
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeSettings()">Cancel</button>
      <button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal">
    <div class="modal-header">
      <h2>Delete Article</h2>
      <button class="icon-btn" onclick="closeDeleteModal()">&#10005;</button>
    </div>
    <div class="modal-body">
      <p style="font-size:0.9rem;color:var(--fg2);">Are you sure you want to delete <strong id="delete-article-title"></strong>? This cannot be undone.</p>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeDeleteModal()">Cancel</button>
      <button class="btn btn-red" id="btn-confirm-delete" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== State =====
let articles = [];
let currentSlug = null;
let currentFilter = 'all';
let coverBase64 = null;
let coverFilename = null;
let deleteTargetSlug = null;
let deleteTargetSha = null;

// ===== Init =====
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('f-date').valueAsDate = new Date();
  loadSettings();
  loadArticles();
});

// ===== GitHub API =====
function getHeaders() {
  const token = localStorage.getItem('gh_token');
  return {
    'Authorization': `token ${token}`,
    'Accept': 'application/vnd.github.v3+json',
    'Content-Type': 'application/json',
  };
}

function getApiBase() {
  const owner = localStorage.getItem('gh_owner') || '';
  const repo = localStorage.getItem('gh_repo') || '';
  return `https://api.github.com/repos/${owner}/${repo}/contents`;
}

function isConfigured() {
  return localStorage.getItem('gh_token') && localStorage.getItem('gh_owner') && localStorage.getItem('gh_repo');
}

async function ghRequest(path, method = 'GET', body = null) {
  const url = `${getApiBase()}${path}`;
  const opts = { method, headers: getHeaders() };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `GitHub API error: ${res.status}`);
  }
  return res.status === 204 ? null : res.json();
}

// ===== Load Articles =====
async function loadArticles() {
  if (!isConfigured()) {
    document.getElementById('article-list').innerHTML = '<div class="empty-state"><p>Configure GitHub settings first.</p><button class="btn btn-sm btn-primary" onclick="openSettings()">Open Settings</button></div>';
    return;
  }

  document.getElementById('article-list').innerHTML = '<div class="loading"><div class="spinner"></div> Loading...</div>';

  try {
    const items = await ghRequest('/content');
    articles = [];
    for (const item of items) {
      if (item.name === 'README.md') continue;
      if (!item.name.endsWith('.mdx') && !item.name.endsWith('.md')) continue;
      try {
        const file = await ghRequest(`/content/${item.name}`);
        const content = atob(file.content.replace(/\n/g, ''));
        const parsed = parseFrontmatter(content);
        articles.push({
          slug: item.name.replace(/\.(mdx|md)$/, ''),
          filename: item.name,
          sha: file.sha,
          ...parsed,
        });
      } catch(e) {
        console.warn(`Failed to load ${item.name}:`, e);
      }
    }
    articles.sort((a, b) => {
      if (a.pinned && !b.pinned) return -1;
      if (!a.pinned && b.pinned) return 1;
      return (b.date || '').localeCompare(a.date || '');
    });
    renderArticleList();
  } catch(e) {
    document.getElementById('article-list').innerHTML = `<div class="empty-state"><p>Failed to load articles.</p><p style="font-size:0.75rem;">${e.message}</p></div>`;
  }
}

function parseFrontmatter(content) {
  const match = content.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
  if (!match) return { title: 'Untitled', date: '', excerpt: '', tags: [], cover: '', status: 'draft', pinned: false, content: content };
  const fm = match[1];
  const body = match[2].trim();
  const get = (name) => { const m = fm.match(new RegExp(name + ':\\s*"([^"]*)"')); return m ? m[1] : ''; };
  const getArr = (name) => { const m = fm.match(new RegExp(name + ':\\s*\\[([^\\]]+)\\]')); return m ? m[1].replace(/"/g, '').split(',').map(s => s.trim()).filter(Boolean) : []; };
  const getBool = (name) => fm.includes(`${name}: true`);
  const getStatus = () => { const m = fm.match(/status:\s*"?(draft|published)"?/); return m ? m[1] : 'published'; };
  return {
    title: get('title') || 'Untitled',
    date: get('date'),
    excerpt: get('excerpt'),
    tags: getArr('tags'),
    cover: get('cover'),
    status: getStatus(),
    pinned: getBool('pinned'),
    content: body,
  };
}

function buildFrontmatter(data) {
  let fm = '---\n';
  fm += `title: "${(data.title || '').replace(/"/g, '\\"')}"\n`;
  if (data.date) fm += `date: "${data.date}"\n`;
  if (data.excerpt) fm += `excerpt: "${(data.excerpt || '').replace(/"/g, '\\"')}"\n`;
  if (data.tags && data.tags.length) fm += `tags: [${data.tags.map(t => `"${t}"`).join(', ')}]\n`;
  if (data.cover) fm += `cover: "${data.cover}"\n`;
  fm += `status: "${data.status || 'draft'}"\n`;
  if (data.pinned) fm += `pinned: true\n`;
  fm += '---\n\n';
  return fm + (data.content || '');
}

// ===== Render Sidebar =====
function renderArticleList() {
  const search = document.getElementById('search-input').value.toLowerCase();
  let filtered = articles.filter(a => {
    if (currentFilter === 'published' && a.status !== 'published') return false;
    if (currentFilter === 'draft' && a.status !== 'draft') return false;
    if (currentFilter === 'pinned' && !a.pinned) return false;
    if (search && !a.title.toLowerCase().includes(search) && !a.excerpt.toLowerCase().includes(search)) return false;
    return true;
  });

  document.getElementById('count-all').textContent = articles.length;
  document.getElementById('count-published').textContent = articles.filter(a => a.status === 'published').length;
  document.getElementById('count-draft').textContent = articles.filter(a => a.status === 'draft').length;
  document.getElementById('count-pinned').textContent = articles.filter(a => a.pinned).length;

  if (filtered.length === 0) {
    document.getElementById('article-list').innerHTML = '<div class="empty-state"><p>No articles found.</p></div>';
    return;
  }

  document.getElementById('article-list').innerHTML = filtered.map(a => `
    <div class="article-item ${a.slug === currentSlug ? 'active' : ''}" onclick="loadArticle('${a.slug}')">
      <div class="article-item-title">${a.pinned ? '<span class="article-item-pin">&#128204;</span> ' : ''}${escapeHtml(a.title)}</div>
      <div class="article-item-meta">
        <span class="status-dot ${a.status}"></span>
        <span>${a.status}</span>
        <span>&middot;</span>
        <span>${a.date || 'No date'}</span>
        ${a.tags.length ? `<span>&middot;</span><span>${a.tags[0]}</span>` : ''}
      </div>
    </div>
  `).join('');
}

function filterArticles() { renderArticleList(); }
function setFilter(filter, el) {
  currentFilter = filter;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderArticleList();
}

// ===== Article CRUD =====
function createNew() {
  currentSlug = null;
  coverBase64 = null;
  coverFilename = null;
  document.getElementById('f-title').value = '';
  document.getElementById('f-date').valueAsDate = new Date();
  document.getElementById('f-excerpt').value = '';
  document.getElementById('f-tags').value = '';
  document.getElementById('f-status').value = 'draft';
  document.getElementById('f-pinned').checked = false;
  document.getElementById('editor').value = '';
  document.getElementById('cover-preview').innerHTML = '<span class="cover-preview-placeholder">No image</span>';
  document.getElementById('slug-preview').textContent = 'Slug: --';
  document.querySelectorAll('.article-item').forEach(el => el.classList.remove('active'));
}

function loadArticle(slug) {
  const article = articles.find(a => a.slug === slug);
  if (!article) return;
  currentSlug = slug;
  coverBase64 = null;
  coverFilename = null;
  document.getElementById('f-title').value = article.title;
  document.getElementById('f-date').value = article.date;
  document.getElementById('f-excerpt').value = article.excerpt;
  document.getElementById('f-tags').value = article.tags.join(', ');
  document.getElementById('f-status').value = article.status;
  document.getElementById('f-pinned').checked = article.pinned;
  document.getElementById('editor').value = article.content;
  if (article.cover) {
    document.getElementById('cover-preview').innerHTML = `<img src="${article.cover}" alt="Cover">`;
  } else {
    document.getElementById('cover-preview').innerHTML = '<span class="cover-preview-placeholder">No image</span>';
  }
  updateSlug();
  renderArticleList();
}

function updateSlug() {
  const title = document.getElementById('f-title').value;
  const slug = title.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
  document.getElementById('slug-preview').textContent = 'Slug: ' + (slug || '--');
}

function getSlug() {
  return document.getElementById('f-title').value.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '') || 'untitled';
}

// ===== Image Upload =====
async function uploadImage(base64Data, filename) {
  const path = `/public/blog/${filename}`;
  const body = {
    message: `Upload ${filename}`,
    content: base64Data,
  };

  if (articles.find(a => a.cover === `/blog/${filename}`)) {
    const existing = await ghRequest(`/public/blog/${filename}`);
    body.sha = existing.sha;
  }

  await ghRequest(path, 'PUT', body);
  return `/blog/${filename}`;
}

// ===== Image Compression =====
function autoCompressImage(file, maxWidth, maxHeight, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width;
        let h = img.height;

        if (w > maxWidth) {
          h = Math.round(h * maxWidth / w);
          w = maxWidth;
        }
        if (h > maxHeight) {
          w = Math.round(w * maxHeight / h);
          h = maxHeight;
        }

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);

        canvas.toBlob((blob) => {
          if (!blob) { reject(new Error('Compression failed')); return; }
          const reader2 = new FileReader();
          reader2.onload = () => {
            const base64 = reader2.result.split(',')[1];
            const sizeKB = Math.round(blob.size / 1024);
            resolve({ base64, width: w, height: h, sizeKB, type: blob.type });
          };
          reader2.readAsDataURL(blob);
        }, 'image/jpeg', quality);
      };
      img.onerror = () => reject(new Error('Failed to load image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Failed to read file'));
    reader.readAsDataURL(file);
  });
}

function formatSize(kb) {
  return kb >= 1024 ? (kb / 1024).toFixed(1) + 'MB' : kb + 'KB';
}

function handleCoverUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const ext = 'jpg';
  coverFilename = `cover-${getSlug()}-${Date.now()}.${ext}`;
  showToast('Compressing image...');
  autoCompressImage(file, 1200, 630, 0.82).then((result) => {
    coverBase64 = result.base64;
    const displayUrl = `data:image/jpeg;base64,${result.base64}`;
    document.getElementById('cover-preview').innerHTML = `<img src="${displayUrl}" alt="Cover">`;
    showToast(`Compressed: ${formatSize(result.sizeKB)} (${result.width}x${result.height})`, 'success');
  }).catch((err) => {
    showToast('Compression failed: ' + err.message, 'error');
  });
  e.target.value = '';
}

function clearCover() {
  coverBase64 = null;
  coverFilename = null;
  document.getElementById('cover-preview').innerHTML = '<span class="cover-preview-placeholder">No image</span>';
  document.getElementById('cover-input').value = '';
}

function triggerInlineImage() {
  document.getElementById('inline-image-input').click();
}

async function handleInlineImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const ext = 'jpg';
  const filename = `inline-${getSlug()}-${Date.now()}.${ext}`;

  showToast('Compressing image...');
  try {
    const result = await autoCompressImage(file, 1200, 800, 0.80);
    showToast(`Uploading ${formatSize(result.sizeKB)}...`);
    await uploadImage(result.base64, filename);
    insertFormat('img', `/blog/${filename}`);
    showToast('Image uploaded!', 'success');
  } catch(err) {
    showToast('Failed: ' + err.message, 'error');
  }
  e.target.value = '';
}

// ===== Editor Toolbar =====
function insertFormat(type, customValue) {
  const editor = document.getElementById('editor');
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  const sel = editor.value.substring(start, end);
  const before = editor.value.substring(0, start);
  const after = editor.value.substring(end);

  let insert = '';
  let cursorOffset = 0;

  switch(type) {
    case 'bold': insert = `**${sel || 'bold text'}**`; cursorOffset = sel ? insert.length : 2; break;
    case 'italic': insert = `*${sel || 'italic text'}*`; cursorOffset = sel ? insert.length : 1; break;
    case 'strike': insert = `~~${sel || 'strikethrough'}~~`; cursorOffset = sel ? insert.length : 2; break;
    case 'h2': insert = `\n## ${sel || 'Heading 2'}`; cursorOffset = insert.length; break;
    case 'h3': insert = `\n### ${sel || 'Heading 3'}`; cursorOffset = insert.length; break;
    case 'link': insert = `[${sel || 'link text'}](url)`; cursorOffset = sel ? insert.length - 4 : 1; break;
    case 'img': insert = `\n![${sel || 'alt text'}](${customValue || '/blog/image.jpg'})\n`; cursorOffset = insert.length; break;
    case 'code': insert = `\n\`\`\`\n${sel || 'code here'}\n\`\`\``; cursorOffset = sel ? insert.length : 4; break;
    case 'inlinecode': insert = `\`${sel || 'code'}\``; cursorOffset = sel ? insert.length : 1; break;
    case 'quote': insert = `\n> ${sel || 'quote'}`; cursorOffset = insert.length; break;
    case 'ul': insert = `\n- ${sel || 'list item'}`; cursorOffset = insert.length; break;
    case 'ol': insert = `\n1. ${sel || 'list item'}`; cursorOffset = insert.length; break;
    case 'hr': insert = `\n\n---\n\n`; cursorOffset = insert.length; break;
  }

  editor.value = before + insert + after;
  editor.focus();
  const newPos = start + cursorOffset;
  editor.setSelectionRange(newPos, newPos);
}

// ===== Preview =====
function renderPreview() {
  let md = document.getElementById('editor').value;
  md = md.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  md = md.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  md = md.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  md = md.replace(/^---$/gm, '<hr>');
  md = md.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  md = md.replace(/\*(.+?)\*/g, '<em>$1</em>');
  md = md.replace(/~~(.+?)~~/g, '<s>$1</s>');
  md = md.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  md = md.replace(/```[\s\S]*?```/g, m => {
    const code = m.replace(/```\w*\n?/, '').replace(/```$/, '');
    return '<pre><code>' + escapeHtml(code.trim()) + '</code></pre>';
  });
  md = md.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
  md = md.replace(/!\[(.+?)\]\((.+?)\)/g, '<img src="$2" alt="$1">');
  md = md.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2">$1</a>');
  md = md.replace(/^- (.+)$/gm, '<li>$1</li>');
  md = md.replace(/(<li>.*<\/li>\n?)+/g, m => '<ul>' + m + '</ul>');
  md = md.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  md = md.split('\n\n').map(block => {
    block = block.trim();
    if (!block || block.startsWith('<h') || block.startsWith('<hr') || block.startsWith('<ul') || block.startsWith('<ol') || block.startsWith('<pre') || block.startsWith('<blockquote') || block.startsWith('<img')) return block;
    return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
  }).join('\n');
  document.getElementById('preview').innerHTML = md;
}

function switchTab(tab, el) {
  document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  if (tab === 'preview') {
    renderPreview();
    document.getElementById('preview').style.display = 'block';
    document.getElementById('editor').style.display = 'none';
    document.getElementById('toolbar').style.display = 'none';
  } else {
    document.getElementById('preview').style.display = 'none';
    document.getElementById('editor').style.display = 'block';
    document.getElementById('toolbar').style.display = 'flex';
  }
}

// ===== Publish / Save =====
function getFormData() {
  return {
    title: document.getElementById('f-title').value,
    date: document.getElementById('f-date').value,
    excerpt: document.getElementById('f-excerpt').value,
    tags: document.getElementById('f-tags').value.split(',').map(s => s.trim()).filter(Boolean),
    status: document.getElementById('f-status').value,
    pinned: document.getElementById('f-pinned').checked,
    content: document.getElementById('editor').value,
  };
}

async function publishArticle() {
  if (!isConfigured()) { openSettings(); return; }
  const data = getFormData();
  if (!data.title) { showToast('Title is required', 'error'); return; }

  const slug = currentSlug || getSlug();
  const filename = `${slug}.mdx`;

  try {
    showToast('Publishing...');
    let coverPath = '';
    if (coverBase64 && coverFilename) {
      coverPath = await uploadImage(coverBase64, coverFilename);
      data.cover = coverPath;
    } else {
      const existing = articles.find(a => a.slug === slug);
      if (existing && existing.cover) data.cover = existing.cover;
    }

    const mdxContent = buildFrontmatter(data);
    const body = {
      message: `${currentSlug ? 'Update' : 'Publish'} article: ${data.title}`,
      content: btoa(unescape(encodeURIComponent(mdxContent))),
    };

    if (currentSlug) {
      const existing = articles.find(a => a.slug === currentSlug);
      if (existing) body.sha = existing.sha;
    }

    await ghRequest(`/content/${filename}`, 'PUT', body);
    showToast(currentSlug ? 'Article updated!' : 'Article published!', 'success');
    currentSlug = null;
    coverBase64 = null;
    coverFilename = null;
    createNew();
    await loadArticles();
  } catch(e) {
    showToast('Failed: ' + e.message, 'error');
  }
}

async function saveAsDraft() {
  if (!isConfigured()) { openSettings(); return; }
  const data = getFormData();
  data.status = 'draft';
  if (!data.title) { showToast('Title is required', 'error'); return; }

  const slug = currentSlug || getSlug();
  const filename = `${slug}.mdx`;

  try {
    showToast('Saving draft...');
    let coverPath = '';
    if (coverBase64 && coverFilename) {
      coverPath = await uploadImage(coverBase64, coverFilename);
      data.cover = coverPath;
    } else {
      const existing = articles.find(a => a.slug === slug);
      if (existing && existing.cover) data.cover = existing.cover;
    }

    const mdxContent = buildFrontmatter(data);
    const body = {
      message: `Save draft: ${data.title}`,
      content: btoa(unescape(encodeURIComponent(mdxContent))),
    };

    if (currentSlug) {
      const existing = articles.find(a => a.slug === currentSlug);
      if (existing) body.sha = existing.sha;
    }

    await ghRequest(`/content/${filename}`, 'PUT', body);
    showToast('Draft saved!', 'success');
    currentSlug = null;
    coverBase64 = null;
    coverFilename = null;
    createNew();
    await loadArticles();
  } catch(e) {
    showToast('Failed: ' + e.message, 'error');
  }
}

// ===== Delete =====
function openDeleteModal(slug) {
  const article = articles.find(a => a.slug === slug);
  if (!article) return;
  deleteTargetSlug = slug;
  deleteTargetSha = article.sha;
  document.getElementById('delete-article-title').textContent = article.title;
  document.getElementById('delete-modal').classList.add('open');
}

function closeDeleteModal() {
  deleteTargetSlug = null;
  deleteTargetSha = null;
  document.getElementById('delete-modal').classList.remove('open');
}

async function confirmDelete() {
  if (!deleteTargetSlug || !deleteTargetSha) return;
  try {
    showToast('Deleting...');
    await ghRequest(`/content/${deleteTargetSlug}.mdx`, 'DELETE', {
      message: `Delete article: ${deleteTargetSlug}`,
      sha: deleteTargetSha,
    });
    showToast('Article deleted!', 'success');
    closeDeleteModal();
    if (currentSlug === deleteTargetSlug) createNew();
    await loadArticles();
  } catch(e) {
    showToast('Failed: ' + e.message, 'error');
  }
}

// ===== Settings =====
function openSettings() {
  document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';
  document.getElementById('gh-owner').value = localStorage.getItem('gh_owner') || '';
  document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || '';
  document.getElementById('settings-modal').classList.add('open');
}

function closeSettings() {
  document.getElementById('settings-modal').classList.remove('open');
}

function saveSettings() {
  localStorage.setItem('gh_token', document.getElementById('gh-token').value);
  localStorage.setItem('gh_owner', document.getElementById('gh-owner').value);
  localStorage.setItem('gh_repo', document.getElementById('gh-repo').value);
  closeSettings();
  showToast('Settings saved!', 'success');
  loadArticles();
}

function loadSettings() {
  // Settings are already in localStorage, just verify it exists
}

// ===== Utils =====
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(msg, type = '') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => { toast.className = 'toast'; }, 3000);
}

// Tab key in editor
document.getElementById('editor').addEventListener('keydown', function(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = this.selectionStart;
    const end = this.selectionEnd;
    this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
    this.selectionStart = this.selectionEnd = start + 2;
  }
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveAsDraft();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    publishArticle();
  }
});
